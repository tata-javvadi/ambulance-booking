<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Basic ambulance">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <rect y="300" width="640" height="100" fill="#e2e8f0"/>
  <ellipse cx="180" cy="310" rx="70" ry="12" fill="#94a3b8" opacity=".35"/>
  <ellipse cx="420" cy="310" rx="80" ry="12" fill="#94a3b8" opacity=".35"/>
  <!-- body -->
  <rect x="120" y="150" width="340" height="140" rx="18" fill="#ffffff" stroke="#059669" stroke-width="6"/>
  <rect x="420" y="175" width="110" height="115" rx="14" fill="#ffffff" stroke="#059669" stroke-width="6"/>
  <!-- windows -->
  <rect x="440" y="190" width="70" height="50" rx="8" fill="#bae6fd"/>
  <rect x="150" y="170" width="90" height="55" rx="8" fill="#bbf7d0"/>
  <rect x="260" y="170" width="90" height="55" rx="8" fill="#bbf7d0"/>
  <!-- stripe -->
  <rect x="120" y="235" width="410" height="28" fill="#059669"/>
  <text x="250" y="255" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">AMBULANCE</text>
  <!-- cross -->
  <rect x="355" y="175" width="36" height="12" rx="2" fill="#dc2626"/>
  <rect x="367" y="163" width="12" height="36" rx="2" fill="#dc2626"/>
  <!-- lights -->
  <rect x="455" y="155" width="28" height="14" rx="4" fill="#ef4444"/>
  <rect x="490" y="155" width="28" height="14" rx="4" fill="#3b82f6"/>
  <!-- wheels -->
  <circle cx="200" cy="300" r="32" fill="#1e293b"/>
  <circle cx="200" cy="300" r="14" fill="#94a3b8"/>
  <circle cx="450" cy="300" r="32" fill="#1e293b"/>
  <circle cx="450" cy="300" r="14" fill="#94a3b8"/>
</svg>
